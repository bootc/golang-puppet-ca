name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches internal/version
        # The tag must be exactly "v" + the Version constant, so a release
        # can only be published once the version-bump change has landed on
        # the tagged commit. A mismatch (e.g. tagging v0.9.0 while main still
        # says 0.9.0-dev) would bake the wrong version into the artefact
        # names and the binaries' --version output.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          if [ -z "$have" ]; then
            echo "::error::Could not parse the Version constant from internal/version/version.go"
            exit 1
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::Tag $TAG does not match internal/version (Version=\"$have\"). Land a version-bump change setting Version to \"$want\", then re-tag."
            exit 1
          fi
          echo "Tag $TAG matches internal/version"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Shared dist cache instead of setup-go's go.sum-keyed cache; see
          # the dist job in ci.yml. CI's runs on main keep it warm, so the
          # tag build mostly just links.
          cache: false
      - name: Go caches (dist)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: dist-gocache-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            dist-gocache-${{ hashFiles('go.mod', 'go.sum') }}-
            dist-gocache-
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.17.2
      - name: Install aarch64 cross toolchain
        # The FIPS variants are cgo builds (boringcrypto); linking the arm64
        # one on this amd64 runner needs the GNU cross toolchain.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build release artifacts
        run: mage build:dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz \
            dist/checksums.txt
